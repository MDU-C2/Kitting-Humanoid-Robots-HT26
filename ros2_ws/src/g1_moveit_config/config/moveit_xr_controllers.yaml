# For the G1 XR PIPELINE only. This is NOT the old ros2_control hardware driver.
# The endpoint is an OFFLINE/ISOLATED-SIMULATOR prototype, not measured tracking.
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager
moveit_simple_controller_manager:
  controller_names:
    - g1_xr_bridge
    - g1_left_ftp_hand
    - g1_right_ftp_hand
  g1_xr_bridge:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - left_shoulder_pitch_joint
      - left_shoulder_roll_joint
      - left_shoulder_yaw_joint
      - left_elbow_joint
      - left_wrist_roll_joint
      - left_wrist_pitch_joint
      - left_wrist_yaw_joint
      - right_shoulder_pitch_joint
      - right_shoulder_roll_joint
      - right_shoulder_yaw_joint
      - right_elbow_joint
      - right_wrist_roll_joint
      - right_wrist_pitch_joint
      - right_wrist_yaw_joint

  # G1_INSPIRE_FTP_MOVEIT_TRAJECTORY_V1: one FJT action per six-motor hand.
  g1_left_ftp_hand:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: false
    joints:
      - left_little_1_joint
      - left_ring_1_joint
      - left_middle_1_joint
      - left_index_1_joint
      - left_thumb_2_joint
      - left_thumb_1_joint
  g1_right_ftp_hand:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: false
    joints:
      - right_little_1_joint
      - right_ring_1_joint
      - right_middle_1_joint
      - right_index_1_joint
      - right_thumb_2_joint
      - right_thumb_1_joint
