# Pose estimator settings. Rebuild after changing; model, confidence, redetect_every and
# image_size can also be set as launch arguments. Part classes: karis_perception/config/classes.yaml.
karis_pose_estimator:
  ros__parameters:
    # --- files
    karis_dir: ""                 # "" = $KARIS_DIR (<repo>/local_data)
    models_dir: ""                # "" = <karis_dir>/models
    model: ""                     # file in models/ (.pt YOLO, .pth RF-DETR); "" = last used
    classes_file: ""              # "" = karis_perception/config/classes.yaml
    # --- detector
    confidence: 0.6               # confidence threshold (0..1): higher = fewer false detections
    iou: 0.6                      # overlap above which two detections count as one
    image_size: 0                 # YOLO input size in px; 0 = the size the model was trained at
    device: 0                     # GPU index
    min_mask_area_px: 300         # smaller masks are ignored
    redetect_every: 5             # detector every N processed frames (and when a part is lost)
    # --- pose (FoundationPose in the Isaac helper)
    backend: isaac                # the only option
    isaac_service: /karis/fp/estimate_pose
    isaac_timeout_s: 25.0         # longer than the helper's register timeout
    max_register: 1               # registrations per frame after the first (0 = all)
    reregister_iou: 0.2           # drift check: register a part again if mesh/mask overlap drops below this
    settle_reregister: true       # register a part again when it comes to rest after moving
    settle_move_m: 0.02           # "moved" = more than this (or 15 deg) away from its last registration
    settle_still_s: 0.5           # "at rest" = still for this long
    min_valid_depth_px: 50        # a part needs this many depth pixels in its mask
    min_depth_m: 0.1              # depth outside this range is ignored
    max_depth_m: 3.0
    # --- camera input
    color_topic: /g1/head_camera/color/image_raw/compressed
    depth_topic: /g1/head_camera/aligned_depth_to_color/image_raw/compressedDepth
    info_topic: /g1/head_camera/color/camera_info
    depth_scale: 0.001            # 16-bit depth units -> m (RealSense: mm)
    max_stamp_diff: 0.04          # colour/depth pairing tolerance [s]
    # --- outputs
    camera_frame: ""              # "" = frame_id of the images (head_camera_color_optical_frame)
    target_frame: pelvis          # also publish /karis/object_poses_base in this frame ("" = off)
    tf_prefix: karis/             # TF child frames karis/<object_id>
    publish_tf: true
    stamp_source: now             # now = local clock; camera = image stamps (needs synced clocks)
    publish_annotated: true       # /karis/viz/annotated/compressed
    annotated_jpeg_quality: 80
    show: false                   # also an OpenCV window (R reset, D detect, Q quit)
    show_scale: 2.0               # window size relative to the image
