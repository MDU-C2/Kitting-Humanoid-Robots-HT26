[develop]
script_dir=$base/lib/karis_perception
[install]
install_scripts=$base/lib/karis_perception
[flake8]
max-line-length = 120
extend-ignore = E114,E116,E127,E128,E203,E226,E241,E731,W503,W504
exclude = build,install,log,__pycache__
[tool:pytest]
junit_family = xunit2
markers =
    flake8: code style
    linter: code style
