controller_manager:
  ros__parameters:
    update_rate: 200  # Hz

    # Start the G1 hardware interface unconfigured as a safe lockout state.
    # The hardware must be explicitly configured before communication/state
    # feedback is initialized, and explicitly activated before commands are sent.
    # See: g1_control/README.md

    hardware_components_initial_state:
      unconfigured:
        - G1ArmSdkSystem

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_trajectory_controller:
  ros__parameters:
    joints:
      - left_shoulder_pitch_joint
      - left_shoulder_roll_joint
      - left_shoulder_yaw_joint
      - left_elbow_joint
      - left_wrist_roll_joint
      - left_wrist_pitch_joint
      - left_wrist_yaw_joint
      - right_shoulder_pitch_joint
      - right_shoulder_roll_joint
      - right_shoulder_yaw_joint
      - right_elbow_joint
      - right_wrist_roll_joint
      - right_wrist_pitch_joint
      - right_wrist_yaw_joint

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    allow_partial_joints_goal: true

    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 0.0
